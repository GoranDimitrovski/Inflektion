; php artisan serve forks a new PHP process per request; without opcache's
; shared-memory bytecode cache enabled for CLI, every single request
; recompiles the entire vendor tree from source on disk (thousands of files),
; which is the actual cause of multi-second response times in local dev.
; validate_timestamps stays on (with revalidate_freq=0) so edited files are
; still picked up immediately — this only skips recompiling unchanged ones.
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
