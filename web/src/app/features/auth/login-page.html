<section>
  <h1>Log in</h1>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <form (submit)="$event.preventDefault(); onSubmit()">
    <label>
      Email
      <input type="email" [formField]="loginForm.email" />
    </label>
    @if (loginForm.email().errors().length > 0) {
      <p class="field-error">{{ loginForm.email().errors()[0].message }}</p>
    }

    <label>
      Password
      <input type="password" [formField]="loginForm.password" />
    </label>
    @if (loginForm.password().errors().length > 0) {
      <p class="field-error">{{ loginForm.password().errors()[0].message }}</p>
    }

    <button type="submit" [disabled]="submitting()">Log in</button>
  </form>

  <p><a routerLink="/forgot-password">Forgot your password?</a></p>
</section>
