<section>
  <h1>Reset your password</h1>

  @if (submitted()) {
    <p>If that email is registered, we've sent a link to reset your password.</p>
  } @else {
    <form (submit)="$event.preventDefault(); onSubmit()">
      <label>
        Email
        <input type="email" [formField]="requestForm.email" />
      </label>
      @if (requestForm.email().errors().length > 0) {
        <p class="field-error">{{ requestForm.email().errors()[0].message }}</p>
      }

      <button type="submit" [disabled]="submitting()">Send reset link</button>
    </form>
  }

  <p><a routerLink="/login">Back to log in</a></p>
</section>
