<section>
  <h1>Choose a new password</h1>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <form (submit)="$event.preventDefault(); onSubmit()">
    <label>
      New password
      <input type="password" [formField]="resetForm.password" />
    </label>
    @if (resetForm.password().errors().length > 0) {
      <p class="field-error">{{ resetForm.password().errors()[0].message }}</p>
    }

    <label>
      Confirm password
      <input type="password" [formField]="resetForm.password_confirmation" />
    </label>
    @if (resetForm.password_confirmation().errors().length > 0) {
      <p class="field-error">{{ resetForm.password_confirmation().errors()[0].message }}</p>
    }

    <button type="submit" [disabled]="submitting()">Reset password</button>
  </form>

  <p><a routerLink="/login">Back to log in</a></p>
</section>
