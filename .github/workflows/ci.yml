name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inflection_test
          POSTGRES_USER: inflection
          POSTGRES_PASSWORD: inflection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inflection"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: inflection_test
      DB_USERNAME: inflection
      DB_PASSWORD: inflection

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, intl, mbstring, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Pint (style check)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan, level 6)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPUnit
        run: php artisan test

      - name: Composer audit
        run: composer audit

      - name: Generate OpenAPI spec
        run: php artisan scramble:export --path=../openapi.json

      - name: Fail if OpenAPI spec is out of date
        run: git diff --exit-code -- ../openapi.json

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Copy environment files
        run: |
          cp .env.example .env
          cp api/.env.example api/.env

      - name: Build images
        run: docker compose build

      - name: Start Postgres and Redis
        run: docker compose up -d postgres redis

      - name: Cache Composer packages (api)
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: docker-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: docker-composer-

      - name: Cache pnpm packages (web)
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: docker-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: docker-pnpm-

      - name: Install PHP dependencies
        run: docker compose run --rm app composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: docker compose run --rm web sh -c "pnpm install --frozen-lockfile"

      - name: Generate application key and migrate
        run: |
          docker compose run --rm app php artisan key:generate
          docker compose run --rm app php artisan migrate --force

      - name: Start the app and web containers
        run: docker compose up -d app web

      - name: Wait for the API to accept connections
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ && exit 0
            sleep 2
          done
          echo "API never became ready" >&2
          exit 1

      - name: Wait for the web dev server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200/ && exit 0
            sleep 2
          done
          echo "Web dev server never became ready" >&2
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

  web:
    name: Web (Angular 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm run generate:client

      - name: Fail if generated client is out of date
        run: git diff --exit-code -- src/app/api

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm exec ng test --watch=false
